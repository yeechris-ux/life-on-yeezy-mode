  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

font-weight: 500;\n  font-display: swap;\n  src: url(\"141d33f1-950b-4ad9-8e9e-958ce033919d\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"447c2ae6-45c8-4a7d-9d21-25a83bd15553\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"3463a681-9d4b-46cd-be0e-67057e858c1b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    --on-accent: #0a0a0a;\n    --bg: #0a0a0a; --surface: #121212; --surface2: #181818;\n    --line: rgba(255,255,255,0.09); --fg: #f2f2f0; --muted: #8e8e88;\n    --accent: #f0b34a; --glow: rgba(240,179,74,0.18);\n  }\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  body {\n    background: var(--bg); color: var(--fg);\n    font-family: \"Instrument Sans\", Helvetica, sans-serif;\n    -webkit-font-smoothing: antialiased;\n    transition: background 240ms ease, color 240ms ease;\n  }\n  a { color: var(--fg); text-decoration: none; }\n  a:hover { color: var(--accent); }\n  ::selection { background: var(--glow); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background: var(--bg); color: var(--fg); min-height: 100vh; font-family: 'Instrument Sans', Helvetica, sans-serif;\">\n\n  <header style=\"position: sticky; top: 0; z-index: 50; backdrop-filter: blur(14px); background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid var(--line);\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; gap: 24px;\">\n      <a href=\"#top\" style=\"display: flex; align-items: center; gap: 12px; flex: none;\">\n        <span style=\"width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--accent); box-shadow: 0 0 18px var(--glow); display: block;\"><\u002Fspan>\n        <span style=\"font-size: 15px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;\">Life on Yeezy Mode<\u002Fspan>\n      <\u002Fa>\n      <nav style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end;\">\n        <a href=\"#articles\" style=\"font-size: 14px; color: var(--muted); padding: 8px 12px; border-radius: 8px;\" style-hover=\"color: var(--fg); background: var(--surface2);\">Articles<\u002Fa>\n        <a href=\"#media\" style=\"font-size: 14px; color: var(--muted); padding: 8px 12px; border-radius: 8px;\" style-hover=\"color: var(--fg); background: var(--surface2);\">Videos<\u002Fa>\n        <a href=\"#about\" style=\"font-size: 14px; color: var(--muted); padding: 8px 12px; border-radius: 8px;\" style-hover=\"color: var(--fg); background: var(--surface2);\">About<\u002Fa>\n        <a href=\"#newsletter\" style=\"font-size: 14px; color: var(--muted); padding: 8px 12px; border-radius: 8px;\" style-hover=\"color: var(--fg); background: var(--surface2);\">Newsletter<\u002Fa>\n        <button sc-camel-on-click=\"{{ toggleTheme }}\" title=\"{{ themeLabel }}\" style=\"margin-left: 6px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 15px; line-height: 1; cursor: pointer; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace;\" style-hover=\"color: var(--accent); border-color: var(--accent);\">{{ themeGlyph }}<\u002Fbutton>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section id=\"top\" style=\"max-width: 1240px; margin: 0 auto; padding: clamp(64px, 10vw, 132px) 28px clamp(48px, 6vw, 72px);\">\n    <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); margin: 0 0 28px;\">Building · Racing · Traveling<\u002Fp>\n    <h1 style=\"font-size: clamp(38px, 6.4vw, 78px); line-height: 1.04; letter-spacing: -0.03em; font-weight: 600; margin: 0; max-width: 20ch; text-wrap: pretty;\">What I learned building a company, selling it, and starting over on foot.<\u002Fh1>\n    <p style=\"font-size: clamp(17px, 1.5vw, 20px); line-height: 1.7; color: var(--muted); max-width: 60ch; margin: 32px 0 0; text-wrap: pretty;\">I’m Christopher Yee. I went from CPA to founder, built Brew Your Bucha and The Cocktail Box Co. from $0 to $2.8M+ in revenue, and sold both in a multi-seven-figure exit in 2021 — retired at 35. Now I coach runners, chase a sub-2:45 marathon and an Ironman finish, and travel with the people I love. This is where I keep all of it.<\u002Fp>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 40px;\">\n      <a href=\"https://www.youtube.com/@lifeonyeezymode\" sc-camel-on-click=\"{{ openYt }}\" target=\"_blank\" rel=\"noopener\" style=\"padding: 14px 24px; border-radius: 999px; background: var(--accent); color: var(--on-accent, #0a0a0a); font-size: 15px; font-weight: 600;\" style-hover=\"box-shadow: 0 0 32px var(--glow); color: var(--on-accent, #0a0a0a);\">Watch on YouTube<\u002Fa>\n      <a href=\"#articles\" style=\"padding: 14px 24px; border-radius: 999px; border: 1px solid var(--line); font-size: 15px; font-weight: 500; color: var(--muted);\" style-hover=\"color: var(--fg); border-color: var(--fg);\">Read the archive<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"media\" style=\"max-width: 1240px; margin: 0 auto; padding: 0 28px clamp(72px, 9vw, 120px);\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; background: var(--surface);\">\n      <div style=\"position: relative; min-height: 320px; background: #000; display: block;\">\n        <img src=\"cc280f13-1b56-416a-bd21-4dd3050e80f5\" alt=\"Latest video from Life on Yeezy Mode\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;\">\n        <a href=\"https://www.youtube.com/watch?v=13BB7YTAIUs&amp;t=7s\" sc-camel-on-click=\"{{ openVideo }}\" target=\"_blank\" rel=\"noopener\" title=\"Watch on YouTube\" style=\"position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0.12));\">\n          <span style=\"width: 76px; height: 76px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.85); background: rgba(0,0,0,0.5); display: grid; place-items: center; box-shadow: 0 0 42px rgba(0,0,0,0.5);\">\n            <span style=\"width: 0; height: 0; margin-left: 5px; border-left: 17px solid #f7f7f5; border-top: 11px solid transparent; border-bottom: 11px solid transparent; display: block;\"><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n      <div style=\"padding: clamp(28px, 3.5vw, 48px); display: flex; flex-direction: column; justify-content: center; gap: 18px;\">\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent);\">Latest video<\u002Fspan>\n        <h2 style=\"font-size: clamp(26px, 2.8vw, 36px); line-height: 1.15; letter-spacing: -0.02em; font-weight: 600; margin: 0; text-wrap: pretty;\">Latest from the channel<\u002Fh2>\n        <p style=\"font-size: 16px; line-height: 1.7; color: var(--muted); margin: 0; max-width: 46ch; text-wrap: pretty;\">Long-form video from the same place the writing comes from — training blocks, race days, the business decisions I’d make differently, and whatever country I’m in this month. No hooks, no hustle edits.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 20px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); padding-top: 6px;\">\n          <span>YouTube<\u002Fspan><span>@lifeonyeezymode<\u002Fspan><span><a href=\"https://www.youtube.com/@lifeonyeezymode\" sc-camel-on-click=\"{{ openYt }}\" target=\"_blank\" rel=\"noopener\" style=\"color: var(--accent);\">Subscribe →<\u002Fa><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width: 1240px; margin: 0 auto; padding: 0 28px clamp(72px, 9vw, 120px);\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 20px; padding-bottom: 32px; border-bottom: 1px solid var(--line);\">\n      <h2 style=\"font-size: clamp(24px, 2.4vw, 32px); font-weight: 600; letter-spacing: -0.02em; margin: 0;\">More from the channel<\u002Fh2>\n      <a href=\"https://www.youtube.com/@lifeonyeezymode\" sc-camel-on-click=\"{{ openYt }}\" target=\"_blank\" rel=\"noopener\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent);\">All videos →<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; padding-top: 36px;\">\n      <sc-for list=\"{{ videos }}\" as=\"v\" hint-placeholder-count=\"5\">\n        <a href=\"{{ v.url }}\" sc-camel-on-click=\"{{ v.open }}\" target=\"_blank\" rel=\"noopener\" title=\"Watch on YouTube\" style=\"display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; transition: transform 200ms ease, border-color 200ms ease, box-shadow 200ms ease;\" style-hover=\"transform: translateY(-4px); border-color: color-mix(in srgb, var(--accent) 55%, transparent); box-shadow: 0 18px 50px rgba(0,0,0,0.45); color: var(--fg);\">\n          <div style=\"position: relative; aspect-ratio: 16 / 9; background-color: #000; background-size: cover; background-position: center; background-image: {{ v.bg }};\">\n            <span style=\"position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(to top, rgba(0,0,0,0.5), rgba(0,0,0,0.05));\">\n              <span style=\"width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.85); background: rgba(0,0,0,0.5); display: grid; place-items: center;\">\n                <span style=\"width: 0; height: 0; margin-left: 3px; border-left: 11px solid #f7f7f5; border-top: 7px solid transparent; border-bottom: 7px solid transparent; display: block;\"><\u002Fspan>\n              <\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding: 18px 20px; display: flex; flex-direction: column; gap: 8px;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);\">Video<\u002Fspan>\n            <h3 style=\"font-size: 17px; line-height: 1.35; letter-spacing: -0.01em; font-weight: 600; margin: 0; text-wrap: pretty;\">{{ v.title }}<\u002Fh3>\n          <\u002Fdiv>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"articles\" style=\"max-width: 1240px; margin: 0 auto; padding: 0 28px clamp(72px, 9vw, 120px);\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 20px; padding-bottom: 28px; border-bottom: 1px solid var(--line);\">\n      <h2 style=\"font-size: clamp(24px, 2.4vw, 32px); font-weight: 600; letter-spacing: -0.02em; margin: 0;\">Thoughts &amp; experiences<\u002Fh2>\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted);\">{{ countLabel }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 10px; padding: 28px 0 40px;\">\n      <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ f.onClick }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 28px;\">\n      <sc-for list=\"{{ posts }}\" as=\"p\" hint-placeholder-count=\"6\">\n        <a href=\"{{ p.href }}\" style=\"display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; transition: transform 200ms ease, border-color 200ms ease, box-shadow 200ms ease;\" style-hover=\"transform: translateY(-4px); border-color: color-mix(in srgb, var(--accent) 55%, transparent); box-shadow: 0 18px 50px rgba(0,0,0,0.45); color: var(--fg);\">\n          <div style=\"position: relative; aspect-ratio: 16 / 10; background: repeating-linear-gradient(115deg, var(--surface2) 0 10px, var(--surface) 10px 20px); display: grid; place-items: center;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);\">{{ p.slot }}<\u002Fspan>\n            <span style=\"position: absolute; top: 14px; left: 14px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--bg) 65%, transparent); padding: 5px 9px; border-radius: 999px;\">{{ p.category }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding: 24px; display: flex; flex-direction: column; gap: 12px; flex: 1;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted);\">{{ p.meta }}<\u002Fspan>\n            <h3 style=\"font-size: 20px; line-height: 1.3; letter-spacing: -0.01em; font-weight: 600; margin: 0; text-wrap: pretty;\">{{ p.title }}<\u002Fh3>\n            <p style=\"font-size: 15px; line-height: 1.65; color: var(--muted); margin: 0; text-wrap: pretty;\">{{ p.excerpt }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"about\" style=\"border-top: 1px solid var(--line); background: var(--surface);\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: clamp(64px, 8vw, 108px) 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: clamp(40px, 6vw, 96px); align-items: start;\">\n      <div style=\"display: flex; flex-direction: column; gap: 22px;\">\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent);\">About<\u002Fspan>\n        <h2 style=\"font-size: clamp(28px, 3.2vw, 42px); line-height: 1.12; letter-spacing: -0.025em; font-weight: 600; margin: 0; text-wrap: pretty;\">Two lives, one operating system.<\u002Fh2>\n        <p style=\"font-size: 16px; line-height: 1.75; color: var(--muted); margin: 0; text-wrap: pretty;\">I spent my twenties as a CPA, reading other people’s balance sheets. Then I built two beverage brands — Brew Your Bucha and The Cocktail Box Co. — past $2.8M in revenue, and sold both in 2021, staying on through 2023 to wind down my obligations before actually stepping away.<\u002Fp>\n        <p style=\"font-size: 16px; line-height: 1.75; color: var(--muted); margin: 0; text-wrap: pretty;\">Retiring at 35 sounds like an ending. It was mostly a quiet room and a lot of questions.<\u002Fp>\n        <p style=\"font-size: 16px; line-height: 1.75; color: var(--muted); margin: 0; text-wrap: pretty;\">What filled it was training — I coach runners now, and I’m building toward a sub-2:45 marathon and an Ironman — and travel, chasing the kind of interactions and detours you can’t plan for.<\u002Fp>\n        <p style=\"font-size: 16px; line-height: 1.75; color: var(--muted); margin: 0; text-wrap: pretty;\">Friends started calling me “Yeezy” years ago, half riffing on my last name, half joking that I make everything look easy. I don’t. This site — and the channel — are where I show the part that isn’t easy: what actually happens behind the scenes, wins and blowups included.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--bg);\">\n        <div style=\"padding: 22px 24px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px;\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);\">Writing<\u002Fspan>\n          <span style=\"font-size: 15px; line-height: 1.6; color: var(--muted);\">Long pieces on building and selling a business, money after the exit, and who you are when the company is gone.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 22px 24px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px;\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);\">Video<\u002Fspan>\n          <span style=\"font-size: 15px; line-height: 1.6; color: var(--muted);\">Race days, training blocks and travel, shot and released in full on YouTube.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 22px 24px; display: flex; flex-direction: column; gap: 6px;\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);\">Coaching<\u002Fspan>\n          <span style=\"font-size: 15px; line-height: 1.6; color: var(--muted);\">How I train and how I coach — the plans, the paces, and the mistakes I stopped making.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"newsletter\" style=\"border-top: 1px solid var(--line);\">\n    <div style=\"max-width: 760px; margin: 0 auto; padding: clamp(64px, 8vw, 104px) 28px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px;\">\n      <h2 style=\"font-size: clamp(26px, 3vw, 38px); line-height: 1.15; letter-spacing: -0.025em; font-weight: 600; margin: 0; text-wrap: pretty;\">One letter a month, from me.<\u002Fh2>\n      <p style=\"font-size: 16px; line-height: 1.7; color: var(--muted); margin: 0; max-width: 48ch;\">What I published, what I'm training for, and one thing I changed my mind about. No pitches.<\u002Fp>\n      <div style=\"width: 100%; max-width: 480px; padding-top: 8px;\"><script async data-uid=\"83d525313d\" src=\"https://life-on-yeezy-mode.kit.com/83d525313d/index.js\"><\u002Fscript><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"border-top: 1px solid var(--line);\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 36px 28px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between;\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted);\">© 2026 Christopher Yee · Life on Yeezy Mode<\u002Fspan>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n        <a href=\"https://www.youtube.com/@lifeonyeezymode\" sc-camel-on-click=\"{{ openYt }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 14px; color: var(--muted); padding: 8px 12px; border-radius: 8px;\" style-hover=\"color: var(--accent); background: var(--surface);\">YouTube<\u002Fa>\n        <a href=\"https://www.linkedin.com/in/christopher-yee-98b61020\" sc-camel-on-click=\"{{ openLi }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 14px; color: var(--muted); padding: 8px 12px; border-radius: 8px;\" style-hover=\"color: var(--accent); background: var(--surface);\">LinkedIn<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e8e6e1&quot;,&quot;options&quot;:[&quot;#f0b34a&quot;,&quot;#5b9dff&quot;,&quot;#7dd3a0&quot;,&quot;#e8e6e1&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;\\&quot;dark\\&quot; | \\&quot;light\\&quot;&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;showFilters&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Archive&quot;}}\">\nconst POSTS = [\n  { category: \"Mindset\", title: \"Redefining Success\", excerpt: \"I missed my personal best by one minute — and somehow walked away more satisfied than when I set it.\", meta: \"9 min read · May 2026\", slot: \"[ photo: Eugene Marathon ]\", href: \"redefining-success.html\" },\n  { category: \"Travel\", title: \"Taking the Leap\", excerpt: \"How taking a chance on love helped me discover what makes me happy.\", meta: \"11 min read · Aug 2025\", slot: \"[ photo: Kuala Lumpur ]\", href: \"taking-the-leap.html\" },\n  { category: \"Health/Fitness\", title: \"Race Recap: UTMB Canyons 100KM Ultramarathon\", excerpt: \"Recapping one of the hardest physical challenges I've completed.\", meta: \"12 min read · Apr 2025\", slot: \"[ photo: Canyons 100K ]\", href: \"utmb-canyons-100km.html\" },\n  { category: \"Health/Fitness\", title: \"Race Recap: Portland Marathon\", excerpt: \"Capping off the 2024 race season.\", meta: \"9 min read · Oct 2024\", slot: \"[ photo: Portland ]\", href: \"portland-marathon.html\" },\n  { category: \"Health/Fitness\", title: \"Race Recap: Ironman Penticton\", excerpt: \"Test of will.\", meta: \"13 min read · Aug 2024\", slot: \"[ photo: Ironman Penticton ]\", href: \"ironman-penticton.html\" },\n  { category: \"Health/Fitness\", title: \"Race Recap: Vancouver Half Marathon\", excerpt: \"Testing my speed at the half marathon distance, five years after my first one.\", meta: \"8 min read · Jun 2024\", slot: \"[ photo: Vancouver ]\", href: \"vancouver-half-marathon.html\" },\n  { category: \"Health/Fitness\", title: \"Redefining Longevity\", excerpt: \"The simple ways to live a more enriched and longer life.\", meta: \"8 min read · Dec 2023\", slot: \"[ photo: longevity ]\", href: \"redefining-longevity.html\" },\n  { category: \"Health/Fitness\", title: \"Becoming a Hybrid Athlete\", excerpt: \"Rethinking athleticism.\", meta: \"9 min read · Dec 2023\", slot: \"[ photo: training ]\", href: \"becoming-a-hybrid-athlete.html\" },\n  { category: \"Mindset\", title: \"Words Unspoken\", excerpt: \"Don't let the things you want to say to the ones that matter go unheard.\", meta: \"10 min read · Nov 2023\", slot: \"[ photo: family ]\", href: \"words-unspoken.html\" }\n];\n\nconst VIDEOS = [\n  { id: \"XRRbdHM48sg\", title: \"The Trip That Changed Everything\" },\n  { id: \"ln2YJD6SoVo\", title: \"The Trip We Never Took — Lessons from my father\" },\n  { id: \"VObuwohtias\", title: \"I Walked Away From It All\" },\n  { id: \"fpafRjrIEJw\", title: \"We Built $2.8M In Here\" },\n  { id: \"nme3pjNru_w\", title: \"We Sold Our Company For Multiple 7 Figures\" }\n];\n\nconst CATS = [\"All\", \"Health/Fitness\", \"Money/Finances\", \"Mindset\", \"Travel\"];\n\nclass Component extends DCLogic {\n  state = { cat: \"All\", theme: this.props.defaultTheme === \"light\" ? \"light\" : \"dark\" };\n\n  componentDidMount() {\n    this._accent = this.props.accentColor;\n    this.applyTheme();\n  }\n\n  applyTheme(theme) {\n    const mode = theme || this.state.theme;\n    const accent = this.props.accentColor || \"#f0b34a\";\n    const dark = {\n      \"--bg\": \"#0a0a0a\", \"--surface\": \"#121212\", \"--surface2\": \"#181818\",\n      \"--line\": \"rgba(255,255,255,0.09)\", \"--fg\": \"#f2f2f0\", \"--muted\": \"#8e8e88\"\n    };\n    const light = {\n      \"--bg\": \"#f8f8f6\", \"--surface\": \"#ffffff\", \"--surface2\": \"#efefec\",\n      \"--line\": \"rgba(0,0,0,0.11)\", \"--fg\": \"#131312\", \"--muted\": \"#6e6e68\"\n    };\n    const vars = mode === \"light\" ? light : dark;\n    const root = document.documentElement;\n    Object.entries(vars).forEach(([k, v]) => root.style.setProperty(k, v));\n    const isLight = mode === \"light\";\n    root.style.setProperty(\"--accent\", isLight ? `color-mix(in srgb, ${accent} 26%, #151310)` : accent);\n    root.style.setProperty(\"--on-accent\", isLight ? \"#fbfbf9\" : \"#0a0a0a\");\n    root.style.setProperty(\"--glow\", `color-mix(in srgb, ${accent} ${isLight ? 30 : 22}%, transparent)`);\n    root.style.colorScheme = mode;\n  }\n\n  chipStyle(active) {\n    return {\n      padding: \"9px 16px\",\n      borderRadius: \"999px\",\n      fontSize: \"13px\",\n      fontWeight: 500,\n      cursor: \"pointer\",\n      fontFamily: \"'JetBrains Mono', monospace\",\n      letterSpacing: \"0.02em\",\n      transition: \"all 180ms ease\",\n      border: active ? \"1px solid var(--accent)\" : \"1px solid var(--line)\",\n      background: active ? \"var(--accent)\" : \"transparent\",\n      color: active ? \"var(--on-accent, #0a0a0a)\" : \"var(--muted)\",\n      boxShadow: active ? \"0 0 26px var(--glow)\" : \"none\"\n    };\n  }\n\n  openExternal(url) {\n    return (e) => {\n      e.preventDefault();\n      const w = (window.top && window.top !== window) ? window.top : window;\n      try { w.open(url, \"_blank\", \"noopener\"); }\n      catch (err) { window.open(url, \"_blank\", \"noopener\"); }\n    };\n  }\n\n  renderVals() {\n    if (this._accent !== undefined && this._accent !== this.props.accentColor) {\n      this._accent = this.props.accentColor;\n      this.applyTheme();\n    }\n    const cat = this.state.cat;\n    const posts = cat === \"All\" ? POSTS : POSTS.filter(p => p.category === cat);\n    const showFilters = this.props.showFilters !== false;\n    return {\n      ytUrl: \"https://www.youtube.com/@lifeonyeezymode\",\n      liUrl: \"https://www.linkedin.com/in/christopher-yee-98b61020\",\n      videoUrl: \"https://www.youtube.com/watch?v=13BB7YTAIUs&t=7s\",\n      openYt: this.openExternal(\"https://www.youtube.com/@lifeonyeezymode\"),\n      openLi: this.openExternal(\"https://www.linkedin.com/in/christopher-yee-98b61020\"),\n      openVideo: this.openExternal(\"https://www.youtube.com/watch?v=13BB7YTAIUs&t=7s\"),\n      videos: VIDEOS.map(v => ({\n        title: v.title,\n        bg: `url(\"https://i.ytimg.com/vi/${v.id}/hqdefault.jpg\")`,\n        url: `https://www.youtube.com/watch?v=${v.id}`,\n        open: this.openExternal(`https://www.youtube.com/watch?v=${v.id}`)\n      })),\n      posts,\n      countLabel: `${posts.length} of ${POSTS.length} pieces`,\n      filters: showFilters ? CATS.map(c => ({\n        label: c,\n        style: this.chipStyle(c === cat),\n        onClick: () => this.setState({ cat: c })\n      })) : [],\n      themeGlyph: this.state.theme === \"dark\" ? \"☾\" : \"☀\",\n      themeLabel: this.state.theme === \"dark\" ? \"Switch to light\" : \"Switch to dark\",\n      toggleTheme: () => {\n        const next = this.state.theme === \"dark\" ? \"light\" : \"dark\";\n        this.applyTheme(next);\n        this.setState({ theme: next });\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
